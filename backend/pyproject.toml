[project]
name = "datasight-pipeline"
version = "0.1.0"
description = "API-first research data pipeline for detecting and matching implicit dataset references."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "celery>=5.6.0",
    "fastapi>=0.115.0",
    "lxml>=6.0.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
datasight = "datasight.interfaces.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datasight = ["assets/tokenizer.json", "assets/QWEN-LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
extraPaths = ["src"]
include = [
    "src",
    "tests",
]
exclude = [
    "data",
    "storage",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.6",
    "httpx>=0.28.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
