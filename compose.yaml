name: datasight

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datasight_pipeline
    ports:
      - "5433:5432"
    volumes:
      - datasight_pgvector_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datasight_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8070;
          printf 'GET /api/isalive HTTP/1.0\r\n\r\n' >&3;
          head -n 1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["sleep", "infinity"]
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: datasight_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GROBID_BASE_URL: http://grobid:8070
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.8-27B}
      LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-195}
      LLM_EXTRACTION_STRATEGY: ${LLM_EXTRACTION_STRATEGY:-legacy}
      UV_PROJECT_ENVIRONMENT: /opt/datasight-venv
    volumes:
      - .:/app
      - datasight_uv_cache:/root/.cache/uv
      - datasight_venv:/opt/datasight-venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: *app_env
    volumes:
      - .:/app
      - datasight_uv_cache:/root/.cache/uv
      - datasight_venv:/opt/datasight-venv
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "uvicorn", "datasight.interfaces.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - datasight_uv_cache:/root/.cache/uv
      - datasight_venv:/opt/datasight-venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker: &pipeline_worker
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    command: ["uv", "run", "celery", "-A", "datasight.infrastructure.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo", "-Q", "celery,download,grobid,processing,matching,export"]
    environment: *app_env
    volumes:
      - .:/app
      - datasight_uv_cache:/root/.cache/uv
      - datasight_venv:/opt/datasight-venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      grobid:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  llm-worker:
    <<: *pipeline_worker
    command: ["uv", "run", "celery", "-A", "datasight.infrastructure.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=prefork", "--concurrency=${LLM_WORKER_CONCURRENCY:-1}", "-Q", "llm"]
    volumes:
      - .:/app
      - datasight_uv_cache:/root/.cache/uv
      - datasight_llm_venv:/opt/datasight-venv

volumes:
  datasight_pgvector_data:
    name: datasight_pgvector_data
  datasight_uv_cache:
    name: datasight_uv_cache
  datasight_venv:
    name: datasight_venv
  datasight_llm_venv:
    name: datasight_llm_venv
